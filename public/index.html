    />
    
    <!-- Open Graph tags -->
    <meta property="og:title" content="Annisa Salsabila | Software Developer" />
    <meta property="og:description" content="Fresh graduate dengan pengalaman langsung di bidang IT, khususnya pengembangan sistem berbasis web dan aplikasi." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Annisa Salsabila | Software Developer</title>

    <!-- Google Translate Widget -->
    <style>
      /* Suppress the default Google Translate top banner */
      .goog-te-banner-frame { display: none !important; }
      .skiptranslate         { display: none !important; }
      body                   { top: 0 !important; }

      /* 
        IMPORTANT: Do NOT use display:none here — it stops Google
        from rendering the <select> that we need to trigger.
        Instead push it far off-screen so it's invisible but still rendered.
      */
      #google_translate_element {
        position: fixed;
        bottom: -9999px;
        left:   -9999px;
        visibility: hidden;
        pointer-events: none;
        z-index: -1;
      }

      /* Hide Google branding inside the widget */
      .goog-logo-link             { display: none !important; }
      .goog-te-gadget > span      { display: none !important; }
      .goog-te-gadget             { font-size: 0 !important; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Hidden Google Translate element (triggered by our custom button) -->
    <div id="google_translate_element"></div>

    <div id="root"></div>

    <!-- Google Translate Script -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'id',
            includedLanguages: 'id,en,ar,zh-CN,zh-TW,fr,de,ja,ko,ms,nl,pt,ru,es,th,vi',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
          },
          'google_translate_element'
        );
      }
    </script>
    <script type="text/javascript"
      src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
    </script>
  </body>
</html>
